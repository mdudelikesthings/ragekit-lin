[package]
name = "ragekit-core"
description = "GTA V and GTA IV archive formats: RPF7, RPF2/3, IMG3"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
sha1 = "0.10"
flate2 = "1"
memmap2 = "0.9"
rayon = "1"
thiserror = "2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
xmltree = { version = "0.12.0", features = ["attribute-order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rage-formats = { version = "0.5", default-features = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
half = "2"
ureq = { version = "3", features = ["platform-verifier"] }

[dev-dependencies]
rand = "0.8"
