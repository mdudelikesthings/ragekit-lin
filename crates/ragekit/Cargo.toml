[package]
name = "ragekit"
description = "Command-line GTA V archive tool for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ragekit"
path = "src/main.rs"

[dependencies]
ragekit-core = { path = "../ragekit-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "6"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.37.0", default-features = false }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
